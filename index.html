<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>擊劍雲端日誌系統 - 姓名加強版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, addDoc, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // --- 請換成你的 Firebase Config ---
  const firebaseConfig = {
       apiKey: "AIzaSyCYW94Wh2Ug9RbxnamLr8Es4E0dV2Lci4k",
       authDomain: "fencing-6e77a.firebaseapp.com",
       projectId: "fencing-6e77a",
       storageBucket: "fencing-6e77a.firebasestorage.app",
       messagingSenderId: "5282801575",
       appId: "1:5282801575:web:0fa005fa7da97c1cc47882"
       };
        // ---------------------------------

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let userData = { name: '', role: '' }; // 儲存當前使用者詳細資料
        let markers = [];
        let currentMode = 'sore';

        // 登入/註冊邏輯
        window.handleAuth = async (type) => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const name = document.getElementById('regName').value; // 真實姓名
            const role = document.querySelector('input[name="role-select"]:checked').value;

            if (!email || !password) return alert("請輸入信箱與密碼");

            try {
                if (type === 'login') {
                    await signInWithEmailAndPassword(auth, email, password);
                } else {
                    if (!name) return alert("註冊請填寫真實姓名");
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    await setDoc(doc(db, "users", userCredential.user.uid), { email, role, name });
                }
            } catch (error) { alert("錯誤: " + error.message); }
        };

        window.handleLogout = () => signOut(auth);

        // 監聽登入狀態並抓取用戶詳細資料
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists()) {
                    userData = userDoc.data();
                    document.getElementById('displayEmail').innerText = `${userData.role === 'coach' ? '教練' : '學員'}: ${userData.name || user.email}`;
                }
                document.getElementById('loginBox').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');
                setupUIByRole();
            } else {
                document.getElementById('loginBox').classList.remove('hidden');
                document.getElementById('mainApp').classList.add('hidden');
            }
        });

        function setupUIByRole() {
            if (userData.role === 'coach') {
                document.getElementById('studentEntrySection').classList.add('hidden');
                loadAllLogs();
            } else {
                document.getElementById('studentEntrySection').classList.remove('hidden');
                loadMyLogs();
            }
        }

        // 標記功能
        window.setMode = (mode) => {
            currentMode = mode;
            document.getElementById('btnSore').className = mode === 'sore' ? 'px-4 py-1 bg-blue-500 text-white rounded-full' : 'px-4 py-1 bg-gray-200 rounded-full';
            document.getElementById('btnPain').className = mode === 'pain' ? 'px-4 py-1 bg-red-500 text-white rounded-full' : 'px-4 py-1 bg-gray-200 rounded-full';
        };

        window.addMarker = (e) => {
            const rect = document.getElementById('bodyMap').getBoundingClientRect();
            const x = ((e.clientX - rect.left) / rect.width) * 100;
            const y = ((e.clientY - rect.top) / rect.height) * 100;
            const marker = { x, y, type: currentMode };
            markers.push(marker);
            renderSingleMarker('markersLayer', marker);
        };

        function renderSingleMarker(layerId, m) {
            const layer = document.getElementById(layerId);
            const el = document.createElement('div');
            el.className = m.type === 'sore' ? 'marker-sore' : 'marker-pain';
            el.style.left = m.x + '%';
            el.style.top = m.y + '%';
            layer.appendChild(el);
        }

        // 日誌存取
        window.saveLog = async () => {
            const logData = {
                uid: currentUser.uid,
                studentName: userData.name || currentUser.email.split('@')[0], // 存入學生姓名
                email: currentUser.email,
                date: document.getElementById('logDate').value,
                intensity: document.getElementById('intensity').value,
                discovery: document.getElementById('discovery').value,
                problem: document.getElementById('problem').value,
                solution: document.getElementById('solution').value,
                reflection: document.getElementById('reflection').value,
                markers: markers,
                timestamp: new Date()
            };
            await addDoc(collection(db, "trainingLogs"), logData);
            alert("提交成功！");
            location.reload();
        };

        async function fetchLogs(q) {
            const querySnapshot = await getDocs(q);
            const tbody = document.getElementById('logTableBody');
            tbody.innerHTML = '';
            querySnapshot.forEach((doc) => {
                const data = doc.data();
                const tr = document.createElement('tr');
                tr.className = "border-b hover:bg-gray-50 text-sm";
                tr.innerHTML = `
                    <td class="p-3 font-medium">${data.date}</td>
                    <td class="p-3 text-blue-700 font-bold">${data.studentName}</td>
                    <td class="p-3"><span class="px-2 py-0.5 bg-gray-100 rounded text-[10px]">${data.intensity}</span></td>
                    <td class="p-3 text-gray-400 truncate max-w-[100px]">${data.problem || ""}</td>
                    <td class="p-3"><button class="text-blue-600 font-bold underline" id="btn-${doc.id}">查看詳情</button></td>
                `;
                tbody.appendChild(tr);
                document.getElementById(`btn-${doc.id}`).onclick = () => showModal(data);
            });
        }

        async function loadMyLogs() { fetchLogs(query(collection(db, "trainingLogs"), where("uid", "==", currentUser.uid), orderBy("date", "desc"))); }
        async function loadAllLogs() { fetchLogs(query(collection(db, "trainingLogs"), orderBy("date", "desc"))); }

        function showModal(data) {
            document.getElementById('modalStudentName').innerText = data.studentName;
            document.getElementById('modalDiscovery').innerText = data.discovery || '無內容';
            document.getElementById('modalProblem').innerText = data.problem || '無內容';
            document.getElementById('modalSolution').innerText = data.solution || '無內容';
            document.getElementById('modalReflection').innerText = data.reflection || '無內容';
            const modalLayer = document.getElementById('modalMarkersLayer');
            modalLayer.innerHTML = ''; 
            if(data.markers) data.markers.forEach(m => renderSingleMarker('modalMarkersLayer', m));
            document.getElementById('detailModal').style.display = 'flex';
        }

        window.closeModal = () => { document.getElementById('detailModal').style.display = 'none'; };

    </script>
    <style>
        .marker-sore { position: absolute; width: 10px; height: 10px; background: #3b82f6; border-radius: 50%; border: 1px solid white; transform: translate(-50%, -50%); z-index: 10; }
        .marker-pain { position: absolute; width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 12px solid #ef4444; transform: translate(-50%, -50%); z-index: 10; }
        .legend-pain { display: inline-block; width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 12px solid #ef4444; margin-right: 4px; }
        .legend-sore { display: inline-block; width: 10px; height: 10px; background: #3b82f6; border-radius: 50%; margin-right: 4px; }
        .body-svg { opacity: 0.2; width: 100%; height: 100%; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- 登入與註冊 -->
    <div id="loginBox" class="flex flex-col items-center justify-center h-screen p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm">
            <h1 class="text-2xl font-black mb-6 text-center italic text-slate-800">FENCING LOG</h1>
            <div class="space-y-4">
                <input type="email" id="email" placeholder="信箱 (Email)" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-400 outline-none">
                <input type="password" id="password" placeholder="密碼 (Password)" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-400 outline-none">
                <div class="bg-blue-50 p-3 rounded-lg">
                    <p class="text-[10px] text-blue-500 font-bold mb-2 tracking-widest uppercase italic text-center">註冊必填資訊</p>
                    <input type="text" id="regName" placeholder="真實姓名 (例如：王小明)" class="w-full border p-2 rounded text-sm outline-none">
                    <div class="flex justify-around mt-3 text-sm font-bold text-slate-600">
                        <label class="cursor-pointer"><input type="radio" name="role-select" value="student" checked> 學員</label>
                        <label class="cursor-pointer"><input type="radio" name="role-select" value="coach"> 教練</label>
                    </div>
                </div>
                <button onclick="handleAuth('login')" class="w-full bg-slate-800 text-white py-2 rounded-lg font-bold hover:bg-slate-700 transition">登入</button>
                <button onclick="handleAuth('signup')" class="w-full bg-white text-slate-800 border border-slate-800 py-2 rounded-lg font-bold hover:bg-slate-50 transition">註冊新帳號</button>
            </div>
        </div>
    </div>

    <!-- 主頁面 -->
    <div id="mainApp" class="hidden">
        <nav class="bg-slate-900 text-white p-4 flex justify-between items-center shadow-lg">
            <span id="displayEmail" class="text-xs font-bold tracking-widest border-l-2 border-blue-500 pl-2"></span>
            <button onclick="handleLogout()" class="bg-red-500 px-3 py-1 rounded-full text-xs font-bold hover:bg-red-600">登出</button>
        </nav>

        <div class="container mx-auto p-4 max-w-6xl">
            <!-- 學員輸入區 -->
            <div id="studentEntrySection" class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
                <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-sm">
                    <h2 class="text-lg font-bold mb-4 border-l-4 border-blue-500 pl-2">今日訓練紀錄填寫</h2>
                    <div class="grid grid-cols-2 gap-4 mb-4">
                        <input type="date" id="logDate" class="border p-2 rounded text-sm outline-none">
                        <select id="intensity" class="border p-2 rounded text-sm bg-yellow-50 font-bold outline-none">
                            <option>輕鬆</option><option selected>還可以</option><option>有點累</option><option>很累</option>
                        </select>
                    </div>
                    <div class="space-y-3">
                        <textarea id="discovery" placeholder="今日新發現 (例如：刺擊姿勢調整)" class="w-full border p-2 rounded h-20 text-sm outline-none focus:border-blue-500"></textarea>
                        <textarea id="problem" placeholder="遇到的問題" class="w-full border p-2 rounded h-20 text-sm outline-none focus:border-red-500"></textarea>
                        <textarea id="solution" placeholder="如何解決" class="w-full border p-2 rounded h-20 text-sm outline-none focus:border-green-500"></textarea>
                        <textarea id="reflection" placeholder="解決後的想法" class="w-full border p-2 rounded h-20 text-sm outline-none focus:border-slate-500"></textarea>
                    </div>
                    <button onclick="saveLog()" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold mt-4 shadow-lg hover:bg-blue-700 transition">提交日誌</button>
                </div>

                <!-- 標記區 -->
                <div class="bg-white p-6 rounded-xl shadow-sm text-center">
                    <h2 class="font-bold mb-4 text-sm tracking-widest text-slate-500 uppercase">身體感覺標記</h2>
                    <div class="flex justify-center gap-2 mb-4">
                        <button id="btnSore" onclick="setMode('sore')" class="px-4 py-1 bg-blue-500 text-white rounded-full text-xs font-bold transition-all shadow-md">● 酸</button>
                        <button id="btnPain" onclick="setMode('pain')" class="px-4 py-1 bg-gray-200 rounded-full text-xs font-bold transition-all">▲ 痛</button>
                    </div>
                    <div id="bodyMap" class="relative w-44 h-80 bg-slate-50 mx-auto rounded-lg border border-slate-200 cursor-crosshair overflow-hidden" onclick="addMarker(event)">
                        <svg viewBox="0 0 100 200" class="body-svg"><path d="M50,10 c5,0 10,5 10,10 s-5,10-10,10 s-10-5-10-10 s5-10 10-10 M40,35 h20 l8,40 l-8,80 l-5,35 h-10 l-5-35 l-8-80 l8-40 Z" fill="#64748b"/></svg>
                        <div id="markersLayer"></div>
                    </div>
                    <button onclick="markers=[];document.getElementById('markersLayer').innerHTML='';" class="text-[10px] text-gray-400 mt-2 underline">清除標記</button>
                </div>
            </div>

            <!-- 列表 -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <h2 class="text-lg font-bold mb-4 italic text-slate-700">📜 訓練紀錄歷史清單</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead><tr class="bg-slate-50 text-slate-400 text-[10px] uppercase tracking-widest">
                            <th class="p-3">日期</th><th class="p-3">學員姓名</th><th class="p-3">強度</th><th class="p-3">問題摘要</th><th class="p-3">操作</th>
                        </tr></thead>
                        <tbody id="logTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- 詳情視窗 -->
    <div id="detailModal" class="fixed inset-0 bg-black/70 hidden items-center justify-center z-[100] p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto p-6 relative shadow-2xl">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-2xl text-gray-400 hover:text-gray-600">&times;</button>
            <h2 class="text-xl font-bold mb-6 border-b pb-2 flex items-center gap-2">
                <span id="modalStudentName" class="text-blue-600"></span> 的訓練詳情
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div class="space-y-4 text-sm">
                    <div><h4 class="font-bold text-blue-600 mb-1">今日新發現：</h4><div id="modalDiscovery" class="bg-blue-50 p-3 rounded-lg border border-blue-100 min-h-[60px]"></div></div>
                    <div><h4 class="font-bold text-red-600 mb-1">遇到的問題：</h4><div id="modalProblem" class="bg-red-50 p-3 rounded-lg border border-red-100 min-h-[60px]"></div></div>
                    <div><h4 class="font-bold text-green-600 mb-1">如何解決：</h4><div id="modalSolution" class="bg-green-50 p-3 rounded-lg border border-green-100 min-h-[60px]"></div></div>
                    <div><h4 class="font-bold text-slate-600 mb-1">解決後的想法：</h4><div id="modalReflection" class="bg-slate-50 p-3 rounded-lg border border-slate-100 min-h-[60px] italic"></div></div>
                </div>
                <div class="flex flex-col items-center justify-center bg-slate-50 rounded-xl p-4">
                    <h4 class="font-bold mb-4 text-xs tracking-tighter text-slate-400 uppercase">身體感覺狀態圖</h4>
                    <div class="relative w-40 h-72 bg-white rounded-lg border border-slate-200 overflow-hidden shadow-inner">
                        <svg viewBox="0 0 100 200" class="body-svg"><path d="M50,10 c5,0 10,5 10,10 s-5,10-10,10 s-10-5-10-10 s5-10 10-10 M40,35 h20 l8,40 l-8,80 l-5,35 h-10 l-5-35 l-8-80 l8-40 Z" fill="#64748b"/></svg>
                        <div id="modalMarkersLayer"></div>
                    </div>
                    <div class="flex gap-4 mt-4 text-[10px] font-bold text-slate-500 italic">
                        <span class="flex items-center"><i class="legend-sore"></i> 酸處</span>
                        <span class="flex items-center"><i class="legend-pain"></i> 痛處</span>
                    </div>
                </div>
            </div>
            <button onclick="closeModal()" class="w-full mt-8 bg-slate-800 text-white py-3 rounded-xl font-bold shadow-lg hover:bg-slate-700 transition">關閉詳情</button>
        </div>
    </div>

</body>
</html>
