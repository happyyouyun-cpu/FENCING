<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>擊劍雲端日誌系統 - 修正版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, addDoc, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // --- 請將此處替換為你從 Firebase 複製的 Config ---
    // --- 請將此處替換為你從 Firebase 控制台複製的 Config ---
        const firebaseConfig = {
		    apiKey: "AIzaSyCYW94Wh2Ug9RbxnamLr8Es4E0dV2Lci4k",
		    authDomain: "fencing-6e77a.firebaseapp.com",
		    projectId: "fencing-6e77a",
		    storageBucket: "fencing-6e77a.firebasestorage.app",
		    messagingSenderId: "5282801575",
		    appId: "1:5282801575:web:0fa005fa7da97c1cc47882"
		    };
        // -----------------------------------------------------

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let userRole = 'student';
        let markers = [];
        let currentMode = 'sore';

        // --- 登入與權限控制 ---
        window.handleAuth = async (type) => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const role = document.querySelector('input[name="role-select"]:checked').value;
            try {
                if (type === 'login') {
                    await signInWithEmailAndPassword(auth, email, password);
                } else {
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    await setDoc(doc(db, "users", userCredential.user.uid), { email, role });
                }
            } catch (error) { alert("錯誤: " + error.message); }
        };

        window.handleLogout = () => signOut(auth);

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                const userDoc = await getDoc(doc(db, "users", user.uid));
                userRole = userDoc.exists() ? userDoc.data().role : 'student';
                document.getElementById('loginBox').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');
                document.getElementById('displayEmail').innerText = `${userRole === 'coach' ? '教練' : '學員'}: ${user.email}`;
                setupUIByRole();
            } else {
                document.getElementById('loginBox').classList.remove('hidden');
                document.getElementById('mainApp').classList.add('hidden');
            }
        });

        function setupUIByRole() {
            if (userRole === 'coach') {
                document.getElementById('studentEntrySection').classList.add('hidden');
                loadAllLogs();
            } else {
                document.getElementById('studentEntrySection').classList.remove('hidden');
                loadMyLogs();
            }
        }

        // --- 標記功能 ---
        window.setMode = (mode) => {
            currentMode = mode;
            document.getElementById('btnSore').className = mode === 'sore' ? 'px-4 py-1 bg-blue-500 text-white rounded-full' : 'px-4 py-1 bg-gray-200 rounded-full';
            document.getElementById('btnPain').className = mode === 'pain' ? 'px-4 py-1 bg-red-500 text-white rounded-full' : 'px-4 py-1 bg-gray-200 rounded-full';
        };

        window.addMarker = (e) => {
            const rect = document.getElementById('bodyMap').getBoundingClientRect();
            const x = ((e.clientX - rect.left) / rect.width) * 100;
            const y = ((e.clientY - rect.top) / rect.height) * 100;
            const marker = { x, y, type: currentMode };
            markers.push(marker);
            renderSingleMarker('markersLayer', marker);
        };

        function renderSingleMarker(layerId, m) {
            const layer = document.getElementById(layerId);
            const el = document.createElement('div');
            el.className = m.type === 'sore' ? 'marker-sore' : 'marker-pain';
            el.style.left = m.x + '%';
            el.style.top = m.y + '%';
            layer.appendChild(el);
        }

        // --- 資料讀寫 ---
        window.saveLog = async () => {
            const logData = {
                uid: currentUser.uid,
                email: currentUser.email,
                date: document.getElementById('logDate').value,
                intensity: document.getElementById('intensity').value,
                discovery: document.getElementById('discovery').value,
                problem: document.getElementById('problem').value,
                solution: document.getElementById('solution').value,
                reflection: document.getElementById('reflection').value,
                markers: markers,
                timestamp: new Date()
            };
            await addDoc(collection(db, "trainingLogs"), logData);
            alert("提交成功！");
            location.reload();
        };

        async function loadMyLogs() { fetchLogs(query(collection(db, "trainingLogs"), where("uid", "==", currentUser.uid), orderBy("date", "desc"))); }
        async function loadAllLogs() { fetchLogs(query(collection(db, "trainingLogs"), orderBy("date", "desc"))); }

        async function fetchLogs(q) {
            const querySnapshot = await getDocs(q);
            const tbody = document.getElementById('logTableBody');
            tbody.innerHTML = '';
            querySnapshot.forEach((doc) => {
                const data = doc.data();
                const tr = document.createElement('tr');
                tr.className = "border-b hover:bg-gray-50";
                tr.innerHTML = `
                    <td class="p-3">${data.date}</td>
                    <td class="p-3">${data.email.split('@')[0]}</td>
                    <td class="p-3">${data.intensity}</td>
                    <td class="p-3 text-gray-500">${data.problem.substring(0, 10)}...</td>
                    <td class="p-3"><button class="text-blue-600 font-bold underline" id="btn-${doc.id}">查看詳情</button></td>
                `;
                tbody.appendChild(tr);
                document.getElementById(`btn-${doc.id}`).onclick = () => showModal(data);
            });
        }

        // --- 詳情彈窗邏輯 ---
        function showModal(data) {
            document.getElementById('modalDiscovery').innerText = data.discovery || '無';
            document.getElementById('modalProblem').innerText = data.problem || '無';
            document.getElementById('modalSolution').innerText = data.solution || '無';
            document.getElementById('modalReflection').innerText = data.reflection || '無';
            
            const modalLayer = document.getElementById('modalMarkersLayer');
            modalLayer.innerHTML = ''; // 清除舊標記
            data.markers.forEach(m => renderSingleMarker('modalMarkersLayer', m));
            
            document.getElementById('detailModal').classList.remove('hidden');
            document.getElementById('detailModal').classList.add('flex');
        }

        window.closeModal = () => {
            document.getElementById('detailModal').classList.add('hidden');
            document.getElementById('detailModal').classList.remove('flex');
        };

    </script>
    <style>
        .marker-sore { position: absolute; width: 12px; height: 12px; background: #3b82f6; border-radius: 50%; border: 2px solid white; transform: translate(-50%, -50%); }
        .marker-pain { position: absolute; width: 0; height: 0; border-left: 7px solid transparent; border-right: 7px solid transparent; border-bottom: 14px solid #ef4444; transform: translate(-50%, -50%); }
        .body-svg { opacity: 0.2; width: 100%; height: 100%; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans">

    <!-- 登入介面 (略同，僅微調樣式) -->
    <div id="loginBox" class="flex flex-col items-center justify-center h-screen">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-96">
            <h1 class="text-3xl font-black mb-6 text-center text-slate-800 italic">FENCING LOG</h1>
            <input type="email" id="email" placeholder="電子信箱" class="w-full border p-3 mb-4 rounded-lg outline-none focus:ring-2 focus:ring-blue-400">
            <input type="password" id="password" placeholder="密碼" class="w-full border p-3 mb-4 rounded-lg outline-none focus:ring-2 focus:ring-blue-400">
            <div class="flex justify-around mb-6 bg-slate-100 p-2 rounded-lg font-bold text-slate-600">
                <label class="cursor-pointer"><input type="radio" name="role-select" value="student" checked> 學員</label>
                <label class="cursor-pointer"><input type="radio" name="role-select" value="coach"> 教練</label>
            </div>
            <button onclick="handleAuth('login')" class="w-full bg-slate-800 text-white py-3 rounded-lg font-bold mb-2 hover:bg-slate-700">登入</button>
            <button onclick="handleAuth('signup')" class="w-full text-slate-500 text-sm py-2">尚未有帳號？點此註冊</button>
        </div>
    </div>

    <!-- 主應用 -->
    <div id="mainApp" class="hidden">
        <nav class="bg-slate-900 text-white p-4 flex justify-between items-center shadow-lg">
            <span id="displayEmail" class="text-sm font-bold tracking-widest"></span>
            <button onclick="handleLogout()" class="bg-red-500 hover:bg-red-600 px-4 py-1 rounded-full text-xs font-bold transition">登出</button>
        </nav>

        <div class="container mx-auto p-4">
            <!-- 學員填寫區 -->
            <div id="studentEntrySection" class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
                <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-sm">
                    <h2 class="text-xl font-bold mb-4 flex items-center gap-2"><span class="w-1 h-6 bg-blue-600 rounded"></span>今日訓練內容</h2>
                    <div class="grid grid-cols-2 gap-4 mb-4">
                        <input type="date" id="logDate" class="border p-2 rounded-lg">
                        <select id="intensity" class="border p-2 rounded-lg bg-yellow-50 font-bold">
                            <option>輕鬆</option><option selected>還可以</option><option>有點累</option><option>很累</option>
                        </select>
                    </div>
                    <div class="space-y-3 text-sm">
                        <textarea id="discovery" placeholder="今日新發現" class="w-full border p-3 rounded-lg h-20 outline-none focus:border-blue-400"></textarea>
                        <textarea id="problem" placeholder="遇到的問題" class="w-full border p-3 rounded-lg h-20 outline-none focus:border-blue-400"></textarea>
                        <textarea id="solution" placeholder="如何解決" class="w-full border p-3 rounded-lg h-20 outline-none focus:border-blue-400"></textarea>
                        <textarea id="reflection" placeholder="解決後的想法" class="w-full border p-3 rounded-lg h-20 outline-none focus:border-blue-400"></textarea>
                    </div>
                    <button onclick="saveLog()" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold mt-4 shadow-lg hover:bg-blue-700 transition">提交訓練日誌</button>
                </div>

                <div class="bg-white p-6 rounded-xl shadow-sm border-2 border-blue-50">
                    <h2 class="font-bold mb-4 text-center">身體感覺標記</h2>
                    <div class="flex justify-center gap-4 mb-4">
                        <button id="btnSore" onclick="setMode('sore')" class="px-4 py-1 bg-blue-500 text-white rounded-full text-sm">● 酸</button>
                        <button id="btnPain" onclick="setMode('pain')" class="px-4 py-1 bg-gray-200 rounded-full text-sm">▲ 痛</button>
                    </div>
                    <div id="bodyMap" class="relative w-48 h-80 bg-slate-50 mx-auto rounded-xl border border-slate-200 cursor-crosshair overflow-hidden" onclick="addMarker(event)">
                        <svg viewBox="0 0 100 200" class="body-svg">
                            <path d="M50,10 c5,0 10,5 10,10 s-5,10-10,10 s-10-5-10-10 s5-10 10-10 M40,35 h20 l8,40 l-8,80 l-5,35 h-10 l-5-35 l-8-80 l8-40 Z" fill="#64748b"/>
                        </svg>
                        <div id="markersLayer"></div>
                    </div>
                    <p class="text-[10px] text-gray-400 mt-4 text-center">點擊圖片位置進行標記，教練將會看到您的身體狀態。</p>
                </div>
            </div>

            <!-- 歷史列表區 -->
            <div class="bg-white p-6 rounded-xl shadow-sm">
                <h2 class="text-xl font-bold mb-4 italic text-slate-700 flex items-center gap-2">📜 訓練紀錄歷史</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-50 text-slate-500 text-sm">
                                <th class="p-3 font-bold">日期</th><th class="p-3 font-bold">學員</th><th class="p-3 font-bold">強度</th><th class="p-3 font-bold">問題摘要</th><th class="p-3 font-bold">操作</th>
                            </tr>
                        </thead>
                        <tbody id="logTableBody" class="text-sm">
                            <!-- JS 動態插入 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- 詳情彈窗 (Modal) -->
    <div id="detailModal" class="fixed inset-0 bg-black bg-opacity-60 hidden items-center justify-center z-[100] p-4">
        <div class="bg-white rounded-3xl w-full max-w-4xl max-h-[90vh] overflow-y-auto p-6 shadow-2xl relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-3xl text-gray-400">&times;</button>
            <h2 class="text-2xl font-black mb-6 border-b pb-2 text-slate-800">訓練日誌詳情</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <!-- 文字內容 -->
                <div class="space-y-4 text-slate-700">
                    <div><h4 class="font-bold text-blue-600">今日新發現：</h4><p id="modalDiscovery" class="bg-blue-50 p-3 rounded-lg"></p></div>
                    <div><h4 class="font-bold text-red-600">遇到的問題：</h4><p id="modalProblem" class="bg-red-50 p-3 rounded-lg"></p></div>
                    <div><h4 class="font-bold text-green-600">如何解決：</h4><p id="modalSolution" class="bg-green-50 p-3 rounded-lg"></p></div>
                    <div><h4 class="font-bold text-gray-600">解決後的想法：</h4><p id="modalReflection" class="bg-gray-50 p-3 rounded-lg italic"></p></div>
                </div>
                
                <!-- 身體地圖顯示 -->
                <div class="flex flex-col items-center border-l border-gray-100 pl-4">
                    <h4 class="font-bold mb-4 text-slate-800">身體感覺狀態</h4>
                    <div class="relative w-48 h-80 bg-slate-50 rounded-xl border border-slate-200">
                        <svg viewBox="0 0 100 200" class="body-svg">
                            <path d="M50,10 c5,0 10,5 10,10 s-5,10-10,10 s-10-5-10-10 s5-10 10-10 M40,35 h20 l8,40 l-8,80 l-5,35 h-10 l-5-35 l-8-80 l8-40 Z" fill="#64748b"/>
                        </svg>
                        <div id="modalMarkersLayer"></div>
                    </div>
                    <div class="flex gap-4 mt-4 text-xs font-bold text-gray-500">
                        <span class="flex items-center gap-1"><i class="w-3 h-3 bg-blue-500 rounded-full"></i> 酸處</span>
                        <span class="flex items-center gap-1"><i class="w-0 h-0 border-l-[6px] border-l-transparent border-r-[6px] border-r-transparent border-bottom-[10px] border-bottom-red-500"></i> 痛處</span>
                    </div>
                </div>
            </div>
            
            <button onclick="closeModal()" class="w-full mt-8 bg-slate-800 text-white py-3 rounded-xl font-bold">關閉視窗</button>
        </div>
    </div>

</body>
</html>
